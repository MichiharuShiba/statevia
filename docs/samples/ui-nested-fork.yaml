# =============================================================================
# 公式サンプル: 3 重ネスト Fork / Join（nodes 形式・version: 1）
# -----------------------------------------------------------------------------
# 配置: docs/samples/ui-nested-fork.yaml
#
# 外側 → 中間 → 最内の 3 段。各段は「即時枝 + 一段深い Fork」で分岐し、
# 最内だけ並列タスク 2 本。各 Join の next は一段外側の Join（最外は notify）。
# nodes 変換は「枝が Join を供給する」（直接 next、またはネスト Fork→内側 Join→外口）
# で各 Join と照合する。
#
# 起動 input 例: {}
# CLI の Statevia.Service.Cli は states 形式のみ。本ファイルは Service API 経由で検証してください。
# =============================================================================

version: 1

workflow:
  id: sample.nested.fork
  name: NestedForkSample
  description: >
    3 重ネスト並列。外側（即時 + 中間 Fork）→ 中間（即時 + 最内 Fork）→
    最内（A/B）→ 各段の合流 → 完了。
    Hosted では各 Fork が物理子 execution に再帰展開される。

nodes:
  - name: nest.start
    type: start
    label: 開始
    next: nest.outer.fork

  # --- L1 外側 ---
  - name: nest.outer.fork
    type: fork
    label: 外側並列
    branches:
      - nest.outer.fast
      - nest.mid.fork

  - name: nest.outer.fast
    type: action
    label: 外側・即時処理
    action: noop
    next: nest.outer.join

  # --- L2 中間 ---
  - name: nest.mid.fork
    type: fork
    label: 中間並列
    branches:
      - nest.mid.fast
      - nest.inner.fork

  - name: nest.mid.fast
    type: action
    label: 中間・即時処理
    action: noop
    next: nest.mid.join

  # --- L3 最内 ---
  - name: nest.inner.fork
    type: fork
    label: 最内並列
    branches:
      - nest.inner.a
      - nest.inner.b

  - name: nest.inner.a
    type: action
    label: 最内 A
    action: sleep
    input:
      duration: 1s
    next: nest.inner.join

  - name: nest.inner.b
    type: action
    label: 最内 B
    action: sleep
    input:
      duration: 2s
    next: nest.inner.join

  - name: nest.inner.join
    type: join
    label: 最内合流
    mode: all
    next: nest.mid.join

  - name: nest.mid.join
    type: join
    label: 中間合流
    mode: all
    next: nest.outer.join

  - name: nest.outer.join
    type: join
    label: 外側合流
    mode: all
    next: nest.notify

  - name: nest.notify
    type: action
    label: 完了通知
    action: noop
    next: nest.end

  - name: nest.end
    type: end
    label: 完了
